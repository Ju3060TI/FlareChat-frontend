<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - FlareChat</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="lava-bg"></div>

    <div id="app">
        <!-- HEADER -->
        <header id="header">
            <div class="logo">
                <span class="logo-icon">🔥</span>
                <h1>FLARECHAT</h1>
            </div>
            <div id="user-status">
                <span class="status-dot online"></span>
                <span id="username">Gast</span>
            </div>
        </header>

        <!-- HAUPTBEREICH -->
        <main id="main">
            <section id="welcome">
                <div class="welcome-icon">💬</div>
                <h2>Willkommen bei FlareChat!</h2>
                <p>
                    Dein Echtzeit-Messenger im Lava-Design.<br />
                    Melde dich an oder erstelle einen Account.
                </p>
                <div class="welcome-actions">
                    <a href="/login" class="btn-primary">🔐 Anmelden</a>
                    <a href="/register" class="btn-outline">📝 Registrieren</a>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
